name: azure-private-endpoint-operator
serviceType: managed

image:
  registry: gsoci.azurecr.io
  name: giantswarm/azure-private-endpoint-operator
  tag: ""
  pullPolicy: IfNotPresent

pod:
  user:
    id: "65532"
  group:
    id: "65532"

# Add seccomp to pod security context
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Add seccomp to container security context
securityContext:
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

managementCluster:
  name: PLACEHOLDER
  namespace: org-giantswarm

azure:
  workloadIdentity:
    clientID: ""

azureClusterGates:
  - GSPrivateLinksReady
  - GSDNSZoneReady

kyvernoPolicyExceptions:
  enabled: true
  legacy:
    # Renders the kyverno.io/v2 PolicyException, which applies to ClusterPolicies only. Will be used as a global switch in a future release.
    enabled: true
